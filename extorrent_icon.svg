<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- 배경 (둥근 사각형) -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bgGrad)"/>

  <!-- 로고 텍스트: eX + T -->
  <text x="128" y="158"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="800"
        font-size="108"
        text-anchor="middle"
        fill="#FFFFFF">eX<tspan fill="#34D399">T</tspan></text>

  <!-- 밑줄 포인트 (T 아래 강조선) -->
  <rect x="150" y="176" width="46" height="8" rx="4" fill="#34D399"/>
</svg>